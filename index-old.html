:root[data-skin="immortal"][lang] h1,:root[data-skin="immortal"][lang] .chead b,:root[data-skin="immortal"][lang] .timer .t,:root[data-skin="immortal"][lang] .vs2{

/* palette: Blood Moon — red and steel */
:root[data-skin="immortal-blood"]{--m1:#ffffff;--m2:#c9ced8;--m3:#5f6672;--fire:232,32,42;--metal:200,206,216;--deep:#140306;--split1:150,8,14;--split2:70,74,84;
  --bg:#0b0304;--bg2:#150507;--surf:#1f0709;--surf2:#320b10;--ink:#fbecea;--mute:#c59a96;--page:#050102}
/* palette: Obsidian & Ember — blue-black and copper */
:root[data-skin="immortal-ember"]{--m1:#ffe0c2;--m2:#f08a3e;--m3:#7a3412;--fire:255,110,20;--metal:240,138,62;--deep:#1a0902;--split1:20,40,70;--split2:140,55,10;
  --bg:#07090d;--bg2:#0c1016;--surf:#121820;--surf2:#1c2632;--ink:#eef2f6;--mute:#93a3b5;--page:#030406}
/* palette: Imperial Night — violet, gold, crimson */
:root[data-skin="immortal-royal"]{--m1:#fff3cf;--m2:#e8be5a;--m3:#8a5a14;--fire:214,40,110;--metal:232,190,90;--deep:#170d05;--split1:110,14,60;--split2:60,30,110;
  --bg:#09060f;--bg2:#100a1a;--surf:#171026;--surf2:#241939;--ink:#f6efe2;--mute:#ab9cc0;--page:#040209}
/* Immortal Kombat skin: scorched metal, filigree, fire, embers */
:root[data-skin^="immortal"] .device{background:
  radial-gradient(120% 55% at 50% 112%,rgba(var(--fire),.36),rgba(var(--fire),.08) 45%,transparent 70%),
  radial-gradient(90% 40% at 50% -8%,rgba(var(--metal),.16),transparent 70%),
  repeating-linear-gradient(115deg,rgba(255,255,255,.012) 0 2px,transparent 2px 7px),
  var(--bg)}
:root[data-skin^="immortal"] .device::before{background:radial-gradient(closest-side at 50% 42%,transparent 55%,rgba(0,0,0,.65))}
:root[data-skin^="immortal"] h1{background:linear-gradient(180deg,var(--m1),var(--m2) 55%,var(--m3));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.6))}
:root[data-skin^="immortal"] .btn.pri{background:linear-gradient(180deg,var(--m1),var(--m2) 45%,var(--m3));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 18px rgba(var(--fire),.35);color:var(--deep)}
:root[data-skin^="immortal"] .tile,:root[data-skin^="immortal"] .court{background:linear-gradient(180deg,var(--surf2),var(--surf));border-color:rgba(var(--metal),.3)}
:root[data-skin^="immortal"] .tile.on{background:linear-gradient(135deg,rgba(var(--fire),.24),var(--surf) 70%);border-color:var(--m2)}
:root[data-skin^="immortal"] .av{border:2px solid var(--m2);box-shadow:0 0 0 2px var(--deep),0 0 0 3px rgba(var(--metal),.45),0 0 14px color-mix(in srgb,var(--pc,#ff8a1f) 60%,transparent)}
:root[data-skin^="immortal"] .chead b,:root[data-skin^="immortal"] .stepno{font-family:var(--f-lat);font-weight:900;letter-spacing:.12em;color:var(--m2)}
:root[data-skin^="immortal"] .vsln{font-family:var(--f-lat);font-weight:900;color:rgb(var(--fire))}
:root[data-skin^="immortal"] .timer .t{font-family:var(--f-lat);font-weight:900;background:linear-gradient(180deg,var(--m1),var(--m2) 60%,var(--m3));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 14px rgba(var(--fire),.5))}
:root[data-skin^="immortal"] .timer .t.low{background:linear-gradient(180deg,#ffb3a0,#d4141c);-webkit-background-clip:text;background-clip:text}
:root[data-skin^="immortal"] .hbar i{background:linear-gradient(90deg,#d4141c,rgb(var(--fire)),var(--m1))}
:root[data-skin^="immortal"] .ov{background:
  linear-gradient(104deg,rgba(var(--split1),.85) 0 49.4%,transparent 49.4% 50.6%,rgba(var(--split2),.85) 50.6%),
  radial-gradient(circle at 50% 45%,rgba(var(--fire),.5),#000 75%)}
:root[data-skin^="immortal"] .ov .r,:root[data-skin^="immortal"] .ov .f{font-family:var(--f-lat);font-weight:900}
:root[data-skin^="immortal"] .ov .f{background:linear-gradient(180deg,var(--m1),var(--m2) 45%,var(--m3));-webkit-background-clip:text;background-clip:text}
:root[data-skin^="immortal"] .langs button.on,:root[data-skin^="immortal"] .seg button.on,:root[data-skin^="immortal"] .rchips button.on{background:linear-gradient(180deg,var(--m1),var(--m2) 60%,var(--m3));color:var(--deep)}
.crack{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.ov>*:not(.crack){position:relative;z-index:1}
.crest{display:none}
:root[data-skin^="immortal"] .crest{display:block;position:absolute;left:50%;top:46%;width:86%;aspect-ratio:470/520;transform:translate(-50%,-50%);background:var(--gri) center/contain no-repeat;opacity:.075;pointer-events:none;z-index:0;filter:blur(.3px)}
:root[data-skin^="immortal"] .ov::after{content:"";position:absolute;left:50%;top:50%;width:92%;aspect-ratio:470/520;transform:translate(-50%,-50%);background:var(--gri) center/contain no-repeat;opacity:.2;z-index:0;pointer-events:none}
.medal{display:block;width:96px;height:96px;margin:0 auto 6px;filter:drop-shadow(0 0 16px rgba(255,138,31,.55))}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.top .logo{flex:none}
.top .badge{font-size:9px;padding:3px 5px}
:root[data-skin^="immortal"] .top .badge{display:none}
.top{gap:8px}
.wm{display:block;height:50px;width:auto;max-width:none;filter:drop-shadow(0 0 10px rgba(255,138,31,.35))}
:root[data-skin="neon"]{
  --bg:#0a0717; --bg2:#100a24; --surf:#171032; --surf2:#22184a; --ink:#f3ecff; --mute:#a597c9;
  --line:rgba(190,150,255,.2); --acc:#ff2fb4; --acc2:#2ff3ff; --on-acc:#18041a; --glow:rgba(255,47,180,.55); --page:#05030c;
}
:root[data-skin="club"]{
  --bg:#09150f; --bg2:#0d1d15; --surf:#12261c; --surf2:#1a3427; --ink:#eef7ee; --mute:#9bb8a6;
  --line:rgba(200,255,61,.16); --acc:#c8ff3d; --acc2:#ffffff; --on-acc:#0a1611; --glow:rgba(200,255,61,.4); --page:#040a07;
}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}

/* device */
.stage{height:100%;display:flex;align-items:center;justify-content:center}
.device{position:relative;width:100%;height:100%;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.island{display:none}
@media (min-width:760px) and (min-height:700px){
  .device{border-radius:58px}
  .device>#layer>*{border-radius:47px}
  body{background:radial-gradient(1200px 700px at 50% 40%,color-mix(in srgb,var(--acc) 14%,var(--page)),var(--page))}
  .stage{position:fixed;inset:0}
  .device{flex:none;width:424px;height:896px;border-radius:58px;border:11px solid #17161a;transform:scale(var(--fs,1));transform-origin:center center;--sab:30px;--sal:14px;
    box-shadow:0 0 0 2px #3a383f,0 40px 90px rgba(0,0,0,.7),0 0 80px color-mix(in srgb,var(--acc) 22%,transparent)}
  .island{display:block;position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#000;z-index:50}
  .device .top{padding-top:52px}
}
.device::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(420px 260px at 80% -40px,color-mix(in srgb,var(--acc) 30%,transparent),transparent 70%),
             radial-gradient(360px 240px at 0% 105%,color-mix(in srgb,var(--acc2) 12%,transparent),transparent 70%)}
.device::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:40;opacity:.07;
  background:repeating-linear-gradient(0deg,#000 0 1px,transparent 1px 3px)}

/* header */
.top{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
.logo{display:flex;flex-direction:column;line-height:1;min-width:0}
.logo b{font-family:var(--f-disp);font-weight:400;font-size:19px;letter-spacing:.04em;text-transform:uppercase;
  background:linear-gradient(180deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px var(--glow))}
.logo span{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--mute);margin-top:3px}
.top .sp{flex:1}
.langs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.langs button{font-size:13px;font-weight:700;letter-spacing:.06em;padding:9px 11px;color:var(--mute)}
.langs button.on{background:var(--acc);color:var(--on-acc)}
.badge{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:6px;border:1px solid var(--line);color:var(--mute)}

/* content */
.content{position:relative;z-index:1;flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 12px;-webkit-overflow-scrolling:touch}
.foot{position:relative;z-index:2;padding:10px calc(16px + var(--sal)) calc(12px + var(--sab));background:linear-gradient(0deg,var(--bg) 70%,transparent);display:flex;gap:10px}
h1{font-family:var(--f-disp);font-weight:400;font-size:26px;line-height:1.08;margin:6px 0 6px;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.hint{color:var(--mute);font-size:15px;margin:0 0 14px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:16px 0 8px}

/* progress (health bar) */

function t(k,v){const L=T[S.lang]||T.ru;let s=L[k]!==undefined?L[k]:(T.en[k]!==undefined?T.en[k]:k);if(v&&typeof s==="string")s=s.replace(/\{(\w+)\}/g,(m,x)=>v[x]!==undefined?v[x]:m);return s;}

/* ---------------- state ---------------- */
const COLORS=["#ff5a1f","#3fb8ff","#7dff3a","#ffd23f","#b06bff","#ff2d55","#2ff3e0","#ff4fd8","#ffa726","#1de9b6","#e6ebf2","#c6ff00"];
const FORMATS=["americano","mexicano","king","teams"];
const THEMES=["immortal","immortal-blood","immortal-ember","immortal-royal","arcade","neon","club"];
const isImm=()=>String(S.theme||"").startsWith("immortal");
function defaults(){return{v:1,phase:"setup",lang:"ru",n:12,players:[],format:"americano",
  scoring:{mode:"time",minutes:15,points:24},plan:{total:180,change:2,rounds:11,auto:true},
  mix:{method:"random",order:[],strong:[],rating:[]},theme:"immortal",sound:true,stylize:true,courts:[],
  rounds:[],scores:{},cur:0,finished:false,timer:{running:false,endsAt:0,left:900000},money:{total:0,payer:"",paid:{}}};}
let S=defaults(),PH={},db=null,mainRef=null,LOCAL=true,RO=false,BOOT=true;
const CID=Math.random().toString(36).slice(2,10);let lastW=0;
let REG={},PAID={},SCMETA={},UID=null,USER=null,UN={},lastMain={},regFor=null,regDraft=null;
let dirty=false,inflight=false,saveT=null,rev=0,pendingRender=false;
let step=0,tab="round",sel=null,confirmBox=null,lastCur=null,gongKey="",photoFor=null,pasteText="";
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
step=+(ls.get("pfn_step")||0)||0;
const uid=()=>"p"+Math.random().toString(36).slice(2,8);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const nC=()=>Math.max(1,Math.floor(S.n/4));
const P=id=>{const b=S.players.find(p=>p.id===id)||{id:id,name:"?",nick:"",c:0};const r=REG[id];return r?Object.assign({},b,{name:r.name||b.name,nick:r.nick!=null?r.nick:b.nick,g:r.g||b.g,reg:true}):b;};
const Pb=id=>S.players.find(p=>p.id===id)||{};
const pIdx=id=>Math.max(0,S.players.findIndex(p=>p.id===id));

function normalize(){
  const d=defaults();for(const k in d){if(S[k]===undefined)S[k]=d[k];}
  ["scoring","plan","mix","timer","money"].forEach(k=>{S[k]=Object.assign({},d[k],S[k]||{});});
  if(!S.money.paid)S.money.paid={};
  if(S.n<4)S.n=4;S.n=Math.round(S.n/4)*4;
  if(!Array.isArray(S.spare))S.spare=[];
  while(S.players.length<S.n){const i=S.players.length;S.players.push(S.spare.length?S.spare.shift():{id:uid(),name:"",nick:"",g:"m",c:i%COLORS.length});}
  if(S.players.length>S.n){S.spare=S.players.slice(S.n).concat(S.spare).slice(0,24);S.players=S.players.slice(0,S.n);}
  while(S.courts.length<nC())S.courts.push({name:""});
  if(S.courts.length>nC())S.courts=S.courts.slice(0,nC());
  const ids=S.players.map(p=>p.id);
  const ok=a=>Array.isArray(a)&&a.length===ids.length&&ids.every(x=>a.includes(x));
  if(!ok(S.mix.order))S.mix.order=shuffle(ids.slice());
  if(!ok(S.mix.rating))S.mix.rating=ids.slice();
  S.mix.strong=(S.mix.strong||[]).filter(x=>ids.includes(x));
  if(S.plan.auto)S.plan.rounds=suggest();
}

/* ---------------- storage ---------------- */
function save(){if(RO)return;rev++;dirty=true;clearTimeout(saveT);saveT=setTimeout(flush,300);}
async function flush(){
  if(inflight){saveT=setTimeout(flush,200);return;}
  const r=rev;inflight=true;
  try{
    if(LOCAL)ls.set("pfn_state",JSON.stringify(S));
    else{
      S._c=CID;S._w=Date.now();lastW=S._w;
      const cur=clone(S);delete cur.scores;if(cur.money)delete cur.money.paid;
      const patch={};let n=0;
      for(const k in cur){const j=JSON.stringify(cur[k]);if(lastMain[k]!==j){patch[k]=cur[k];n++;}}
      if(n){
        if(!Object.keys(lastMain).length)await mainRef.set(cur);
        else{try{await mainRef.update(patch);}catch(e){if(e&&e.code==="invalid_argument"&&!RO)await mainRef.set(cur);else throw e;}}
        for(const k in patch)lastMain[k]=JSON.stringify(patch[k]);
      }
    }
  }catch(e){
    if(e&&e.code==="invalid_argument"&&!LOCAL){RO=true;toast(t("ro_now"));render();}
    else if(e&&e.code==="unavailable"){inflight=false;setTimeout(flush,800+Math.random()*600);return;}
    else toast(t("save_err"));
  }
  inflight=false;if(r===rev)dirty=false;
}
async function savePhoto(pid,src){
  if(src)PH[pid]=src;else delete PH[pid];
  if(LOCAL){ls.set("pfn_photos",JSON.stringify(PH));return;}
  if(RO)return;
  try{const ref=db.collection("photos").doc(pid);if(src)await ref.set({src:src});else await ref.delete();}catch(e){toast(t("save_err"));}
}
async function resolveNames(ids){
  if(!USER||!USER.profiles)return;const need=[...new Set(ids)].filter(id=>!(id in UN));if(!need.length)return;
  try{const ps=await USER.profiles(need);need.forEach(id=>{UN[id]=(ps&&ps[id]&&ps[id].name)||"";});softRender();}catch(e){}
}
function sideLocal(){ls.set("pfn_side",JSON.stringify({reg:REG,paid:PAID}));}
async function dbWrite(col,id,data){
  if(RO)return false;
  if(LOCAL){sideLocal();ls.set("pfn_state",JSON.stringify(S));return true;}
  try{if(data===null)await db.collection(col).doc(id).delete();else await db.collection(col).doc(id).set(data);return true;}
  catch(e){if(e&&e.code==="invalid_argument"){RO=true;toast(t("ro_now"));render();}else toast(t("save_err"));return false;}
}
function writeScore(key,v){
  S.scores[key]=v;SCMETA[key]={by:UID,at:Date.now()};
  return dbWrite("scores",key,{a:v[0],b:v[1],by:UID||null,at:Date.now()});
}
async function clearScores(){
  const keys=Object.keys(S.scores);S.scores={};SCMETA={};
  if(LOCAL){ls.set("pfn_state",JSON.stringify(S));return;}
  for(const k of keys){try{await db.collection("scores").doc(k).delete();}catch(e){}}
}
function remote(data){
  if(data&&data._c===CID&&(data._w||0)<lastW)return;
  lastMain={};for(const k in data)lastMain[k]=JSON.stringify(data[k]);
  if(dirty||inflight)return;
  const keepScores=S.scores;
  S=Object.assign(defaults(),clone(data));S.scores=keepScores||{};normalize();
  const a=document.activeElement;
  if(a&&a.closest&&a.closest("#dev")&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){pendingRender=true;return;}
  render();
}
async function boot(){
  let dbx=null;
  try{if(window.claude&&typeof window.claude.use==="function")dbx=await window.claude.use("db");}catch(e){dbx=null;}

function processPhoto(file,color,stylize){return new Promise((res,rej)=>{

    x.drawImage(img,sx,sy,m,m,0,0,N,N);
    if(stylize){
      const d=x.getImageData(0,0,N,N),a=d.data;
      for(let i=0;i<a.length;i+=4){const l=.3*a[i]+.59*a[i+1]+.11*a[i+2];const v=Math.max(0,Math.min(255,(l-128)*1.45+128));
        a[i]=v*.75+a[i]*.25;a[i+1]=v*.75+a[i+1]*.25;a[i+2]=v*.75+a[i+2]*.25;}
      x.putImageData(d,0,0);
      x.globalCompositeOperation="overlay";x.globalAlpha=.6;x.fillStyle=color;x.fillRect(0,0,N,N);
      x.globalAlpha=1;x.globalCompositeOperation="multiply";
      const g=x.createRadialGradient(N/2,N*.42,N*.25,N/2,N/2,N*.75);g.addColorStop(0,"#fff");g.addColorStop(1,"#1a1010");x.fillStyle=g;x.fillRect(0,0,N,N);

/* ---------------- scheduling ---------------- */
function roundLen(){return S.scoring.mode==="time"?S.scoring.minutes:Math.round(S.scoring.points*.6);}
function suggest(){const per=roundLen()+S.plan.change;let r=Math.max(1,Math.floor(S.plan.total/per));if(S.format==="americano")r=Math.min(r,S.n-1);return r;}
function dur(m){const h=Math.floor(m/60),mm=m%60;return (h?h+" "+t("h")+" ":"")+String(mm).padStart(h?2:1,"0")+" "+t("min");}
function orderFrom(method){
  const ids=S.players.map(p=>p.id);
  if(method==="baskets"){
    const s=shuffle(S.mix.strong.slice()),w=shuffle(ids.filter(x=>!S.mix.strong.includes(x)));
    const pairs=[];while(s.length&&w.length)pairs.push([s.pop(),w.pop()]);
    const rest=shuffle(s.concat(w));while(rest.length>1)pairs.push([rest.pop(),rest.pop()]);
    shuffle(pairs);const o=[];pairs.forEach(p=>o.push(p[0],p[1]));return o;
  }
  if(method==="rating"){const r=S.mix.rating,o=[];for(let k=0;k<r.length;k+=4)o.push(r[k],r[k+3],r[k+1],r[k+2]);return o;}
  return shuffle(ids.slice());
}
function initial(){const o=S.mix.order,m=[];for(let k=0;k<nC();k++)m.push({a:[o[4*k],o[4*k+1]],b:[o[4*k+2],o[4*k+3]]});return m;}
const pk=(x,y)=>x<y?x+"|"+y:y+"|"+x;
function buildAmericano(R){
  const n=S.n,m0=initial(),PR=[];m0.forEach(x=>{PR.push(x.a);PR.push(x.b);});
  const vm=[];PR.forEach((p,i)=>{vm[i]=p[0];vm[n-1-i]=p[1];});
  const opp={},add=ms=>ms.forEach(mt=>mt.a.forEach(x=>mt.b.forEach(y=>{const k=pk(x,y);opp[k]=(opp[k]||0)+1;})));
  const rounds=[{m:m0}];add(m0);
  for(let r=1;r<R;r++){
    const rr=r%(n-1),L=[];for(let i=0;i<n-1;i++)L.push((i+rr)%(n-1));L.push(n-1);
    const pairs=[];for(let i=0;i<n/2;i++)pairs.push([vm[L[i]],vm[L[n-1-i]]]);
    let best=null,bc=1e9;
    for(let tr=0;tr<500;tr++){const sh=shuffle(pairs.slice()),ms=[];let c=0;
      for(let k=0;k<sh.length;k+=2){const mt={a:sh[k].slice(),b:sh[k+1].slice()};mt.a.forEach(x=>mt.b.forEach(y=>{const v=opp[pk(x,y)]||0;c+=v*v;}));ms.push(mt);}
      if(c<bc){bc=c;best=ms;if(c===0)break;}}
    add(best);rounds.push({m:best});
  }
  return rounds;
}
function buildTeams(R){
  const m0=initial(),mt=m0.length*2,vm=[];m0.forEach((x,k)=>{vm[k]=x.a;vm[mt-1-k]=x.b;});
  const rounds=[{m:m0}];
  for(let r=1;r<R;r++){const rr=mt>1?r%(mt-1):0,L=[];for(let i=0;i<mt-1;i++)L.push((i+rr)%(mt-1));L.push(mt-1);
    const ms=[];for(let i=0;i<mt/2;i++)ms.push({a:vm[L[i]].slice(),b:vm[L[mt-1-i]].slice()});rounds.push({m:ms});}
  return rounds;
}
const sc=(r,c)=>S.scores[r+"_"+c];
function standings(){
  const st={};S.players.forEach(p=>st[p.id]={id:p.id,pts:0,ag:0,w:0,pl:0});
  S.rounds.forEach((rd,r)=>rd.m.forEach((mt,c)=>{const s=sc(r,c);if(!s||s[0]==null||s[1]==null)return;
    const [a,b]=s;mt.a.forEach(id=>{const x=st[id];if(!x)return;x.pts+=a;x.ag+=b;x.pl++;x.w+=a>b?1:a===b?.5:0;});
    mt.b.forEach(id=>{const x=st[id];if(!x)return;x.pts+=b;x.ag+=a;x.pl++;x.w+=b>a?1:a===b?.5:0;});}));
  return Object.values(st).sort((x,y)=>y.pts-x.pts||y.w-x.w||(y.pts-y.ag)-(x.pts-x.ag)||pIdx(x.id)-pIdx(y.id));
}
function genMex(){const o=standings().map(x=>x.id),m=[];for(let k=0;k<nC();k++){const g=o.slice(4*k,4*k+4);m.push({a:[g[0],g[3]],b:[g[1],g[2]]});}return m;}
function genKing(r){
  const ms=S.rounds[r].m,last=ms.length-1,inc=ms.map(()=>[]);
  ms.forEach((mt,j)=>{const s=sc(r,j)||[0,0];const aw=(s[0]||0)>=(s[1]||0);const W=aw?mt.a:mt.b,Lo=aw?mt.b:mt.a;
    inc[Math.max(j-1,0)].push(W.slice());inc[Math.min(j+1,last)].push(Lo.slice());});
  return inc.map(pp=>{const X=pp[0],Y=pp[1]||pp[0];return{a:[X[0],Y[0]],b:[X[1],Y[1]]};});
}
function roundDone(r){const rd=S.rounds[r];return rd&&rd.m.every((_,c)=>{const s=sc(r,c);return s&&s[0]!=null&&s[1]!=null;});}

  if(pickFor){const mx=S.scoring.mode==="points"?S.scoring.points:40;const v=(S.scores[S.cur+"_"+pickFor.c]||[null,null])[pickFor.s];const mt=S.rounds[S.cur]&&S.rounds[S.cur].m[pickFor.c];const ids=mt?(pickFor.s?mt.b:mt.a):[];
    let b="";for(let i=0;i<=mx;i++)b+=`<button class="pk ${v===i?"on":""}" data-act="pickv" data-v="${i}">${i}</button>`;
    h+=`<div class="confirm" style="place-items:end center;padding:0" data-act="pickclose"><div class="box sheet" data-stop="1"><div class="row" style="justify-content:space-between;flex-wrap:nowrap;margin-bottom:10px"><div><div class="lbl" style="margin:0">${t("court")} ${pickFor.c+1} · ${t("pick_t")}</div><div style="font-weight:800;font-size:17px">${ids.map(nm).join(" & ")}</div></div><button class="btn sm" data-act="pickclose">✕</button></div><div class="pkg">${b}</div></div></div>`;}
  if(confirmBox){h+=`<div class="confirm"><div class="box"><p style="font-size:19px;line-height:1.35;font-weight:700;margin:0 0 18px">${confirmBox.text}</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><button class="btn pri" data-act="cyes" style="min-height:56px;font-size:17px">${t("yes")}</button><button class="btn" data-act="cno" style="min-height:56px;font-size:17px">${t("no")}</button></div></div></div>`;}
  L.innerHTML=h;
}
function ask(text,fn){confirmBox={text:text,fn:fn};renderLayer();}
let toastT=null;
function toast(msg){const L=$("#dev");let el=$(".toast");if(!el){el=document.createElement("div");el.className="toast";L.appendChild(el);}el.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),2600);}

/* ---------------- timer tick ---------------- */
function softRender(){setTimeout(()=>{const a=document.activeElement;if(a&&a.closest&&a.closest("#dev")&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){pendingRender=true;return;}render();},30);}
function tick(){
  if(S.phase!=="play"||S.scoring.mode!=="time")return;
  const left=timeLeft(),tm=$("#tm"),hb=$("#hb"),full=S.scoring.minutes*60000;
  if(tm){tm.textContent=fmtT(left);tm.classList.toggle("low",left<60000);}
  if(hb)hb.style.width=Math.max(0,Math.min(100,left/full*100))+"%";
  if(S.timer.running&&left<=0){const key=S.cur+"_"+S.timer.endsAt;if(gongKey!==key){gongKey=key;gong();
      if(!RO){S.timer={running:false,endsAt:0,left:0};save();setTimeout(render,50);}}}
}
setInterval(tick,250);
/* embers (immortal skin only) */
(function(){const cv=document.getElementById("fx");if(!cv||!cv.getContext)return;const x=cv.getContext("2d");let W=0,H=0,ps=[],raf=0;
  const rm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){const r=cv.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0);}
  function mk(y){return{x:Math.random()*W,y:y==null?H+Math.random()*40:y,v:.25+Math.random()*.7,r:.6+Math.random()*1.8,a:.3+Math.random()*.6,w:Math.random()*6.28};}
  let fc="255,200,110",fcT=0;
  function step(){x.clearRect(0,0,W,H);if(isImm()){if(Date.now()-fcT>1000){fcT=Date.now();fc=(getComputedStyle(document.documentElement).getPropertyValue("--fire")||"255,200,110").trim();}for(const p of ps){p.y-=p.v;p.w+=.03;p.x+=Math.sin(p.w)*.3;if(p.y<-10)Object.assign(p,mk());
      const g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*3);g.addColorStop(0,`rgba(${fc},${p.a})`);g.addColorStop(1,`rgba(${fc},0)`);x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,p.r*3,0,6.28);x.fill();}}
    raf=requestAnimationFrame(step);}
  size();for(let i=0;i<36;i++)ps.push(mk(Math.random()*H));window.addEventListener("resize",size);
  if(rm){step();cancelAnimationFrame(raf);}else step();
})();

/* ---------------- actions ---------------- */
function setPath(path,val){const ks=path.split(".");let o=S;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=val;}
function getPath(path){return path.split(".").reduce((o,k)=>o[k],S);}
function resetTimer(){S.timer={running:false,endsAt:0,left:S.scoring.minutes*60000};}
function startTournament(){
  normalize();const R=S.plan.rounds;
  S.rounds=S.format==="americano"?buildAmericano(R):S.format==="teams"?buildTeams(R):[{m:initial()}];
  clearScores();S.cur=0;S.finished=false;S.phase="play";resetTimer();tab="round";lastCur=0;save();render();showOverlay(true);
}
function goNext(){
  const R=Math.max(S.plan.rounds,1);
  if(S.cur<S.rounds.length-1){S.cur++;}
  else if(S.cur+1<R&&(S.format==="mexicano"||S.format==="king")){S.rounds.push({m:S.format==="mexicano"?genMex():genKing(S.cur)});S.cur++;}
  else{S.finished=true;tab="table";save();render();$("#content").scrollTop=0;return;}
  resetTimer();lastCur=S.cur;save();render();showOverlay(true);
}
function setScore(c,side,val){
  const r=S.cur,key=r+"_"+c;const v=(S.scores[key]||[null,null]).slice();
  v[side]=val==null||isNaN(val)?null:Math.max(0,Math.round(val));
  if(S.scoring.mode==="points"&&v[side]!=null){v[side]=Math.min(v[side],S.scoring.points);v[1-side]=S.scoring.points-v[side];}
  writeScore(key,v);
}
function autoNext(){if(S.phase==="play")return;const at=step;setTimeout(()=>{if(step===at&&step<STEPS.length-1){step++;ls.set("pfn_step",String(step));render();$("#content").scrollTop=0;}},320);}
function act(a,d,el){
  if(a==="lang"){S.lang=d.v;save();render();return;}
  if(a==="tab"){tab=d.v;render();$("#content").scrollTop=0;return;}
  if(a==="goround"){S.cur=+d.r;lastCur=S.cur;save();render();return;}
  if(a==="ovclose"){ovShow=false;clearTimeout(ovT);renderLayer();return;}
  if(a==="allr"){showAll=!showAll;render();return;}
  if(a==="pick"){if(RO)return;pickFor={c:+d.c,s:+d.s};renderLayer();return;}
  if(a==="pickclose"){pickFor=null;renderLayer();return;}
  if(a==="pickv"){if(pickFor&&!RO){setScore(pickFor.c,pickFor.s,+d.v);}pickFor=null;renderLayer();render();return;}
  if(a==="regclose"){regFor=null;regDraft=null;renderLayer();return;}
  if(a==="prompt"){const txt=t("prompt_txt");try{navigator.clipboard.writeText(txt).then(()=>toast(t("copied")),()=>toast(txt));}catch(e){toast(txt);}return;}
  if(regFor&&regDraft&&!RO){
    if(a==="rg"){regDraft.g=regDraft.g==="f"?"m":"f";renderLayer();return;}
    if(a==="ragree"){regDraft.agree=!regDraft.agree;renderLayer();return;}
    if(a==="selfie"){photoFor=regFor;const f=$("#file");f.setAttribute("capture","user");f.value="";f.click();return;}
    if(a==="regskip"){savePhoto(regFor,null);renderLayer();render();return;}
    if(a==="rsave"){if(!regDraft.agree){toast(t("reg_need"));return;}const id=regFor;
      REG[id]={name:regDraft.name.trim(),nick:regDraft.nick.trim(),g:regDraft.g,agree:true,by:UID||null,at:Date.now()};
      dbWrite("reg",id,REG[id]);regFor=null;regDraft=null;renderLayer();render();return;}
  }
  if(a==="cno"){confirmBox=null;renderLayer();return;}
  if(a==="cyes"){const f=confirmBox&&confirmBox.fn;confirmBox=null;renderLayer();if(f)f();return;}
  if(a==="gostep"){step=+d.v;ls.set("pfn_step",String(step));render();$("#content").scrollTop=0;return;}
  if(a==="step"){
    const nd=step+(+d.d);
    if(+d.d>0&&STEPS[step]==="names"&&S.players.every(p=>!p.name.trim())){toast(t("no_players"));return;}
    step=Math.max(0,Math.min(STEPS.length-1,nd));ls.set("pfn_step",String(step));render();$("#content").scrollTop=0;return;}
  if(RO)return;
  switch(a){
    case "n":S.n=+d.v;normalize();S.mix.order=shuffle(S.players.map(p=>p.id));autoNext();break;
    case "g":{const p=Pb(d.id);p.g=p.g==="f"?"m":"f";break;}
    case "parse":{const ta=$("#paste");const lines=(ta?ta.value:"").split(/\n/).map(x=>x.replace(/^\s*\d+\s*[\.\)]*\s*\)?\s*/,"").trim()).filter(Boolean);
      if(lines.length>S.n){S.n=Math.min(24,Math.ceil(lines.length/4)*4);normalize();}
      lines.slice(0,S.n).forEach((l,i)=>{const m=l.match(/^(.*?)\s*["“«](.+?)["”»]\s*$/);S.players[i].name=m?m[1].trim():l;if(m)S.players[i].nick=m[2].trim();});
      pasteText="";break;}
    case "photo":photoFor=d.id;$("#file").removeAttribute("capture");$("#file").value="";$("#file").click();return;
    case "rmphoto":savePhoto(d.id,null);render();return;
    case "stylize":S.stylize=!S.stylize;break;
    case "fmt":S.format=d.v;if(S.plan.auto)S.plan.rounds=suggest();autoNext();break;
    case "smode":S.scoring.mode=d.v;if(S.plan.auto)S.plan.rounds=suggest();resetTimer();break;
    case "inc":{const v=Math.max(+d.min,Math.min(+d.max,getPath(d.path)+(+d.d)));setPath(d.path,v);
      if(d.path==="plan.rounds")S.plan.auto=false;else if(S.plan.auto)S.plan.rounds=suggest();
      if(d.path==="scoring.minutes"&&!S.timer.running)resetTimer();break;}
    case "unit":S.plan.unit=d.v;if(d.v==="h"){S.plan.total=Math.min(180,Math.max(60,Math.round(S.plan.total/30)*30));}if(S.plan.auto)S.plan.rounds=suggest();break;
    case "settotal":S.plan.total=+d.v;if(S.plan.auto)S.plan.rounds=suggest();break;
    case "fullcycle":S.scoring.minutes=+d.m;S.plan.rounds=+d.r;S.plan.auto=false;resetTimer();break;
    case "auto":S.plan.auto=true;S.plan.rounds=suggest();break;
    case "mix":S.mix.method=d.v;sel=null;if(d.v==="random")S.mix.order=orderFrom("random");if(d.v==="rating")S.mix.order=orderFrom("rating");break;
    case "shuffle":S.mix.order=orderFrom("random");break;
    case "strong":{const i=S.mix.strong.indexOf(d.id);if(i>=0)S.mix.strong.splice(i,1);else S.mix.strong.push(d.id);render();save();return;}
    case "build":S.mix.order=orderFrom("baskets");break;
    case "rmove":{const i=+d.i,j=i+(+d.d),r=S.mix.rating;if(j<0||j>=r.length)return;[r[i],r[j]]=[r[j],r[i]];break;}
    case "rapply":S.mix.order=orderFrom("rating");break;
    case "swap":{if(!sel){sel=d.id;render();return;}if(sel===d.id){sel=null;render();return;}
      const o=S.mix.order,i=o.indexOf(sel),j=o.indexOf(d.id);if(i>=0&&j>=0)[o[i],o[j]]=[o[j],o[i]];sel=null;break;}
    case "theme":S.theme=d.v;if(S.phase!=="play")autoNext();break;
    case "sound":S.sound=!S.sound;if(S.sound)gong();break;
    case "fight":{const has=S.rounds.length&&Object.keys(S.scores).length;if(has){ask(t("rebuild"),startTournament);return;}startTournament();return;}
    case "lrswap":{const mt=S.rounds[S.cur]&&S.rounds[S.cur].m[+d.c];if(!mt)return;const k=+d.s?"b":"a";mt[k]=[mt[k][1],mt[k][0]];break;}
    case "serves":S.scoring.serves=+d.v;break;
    case "tstart":{const left=S.timer.left>0?S.timer.left:S.scoring.minutes*60000;S.timer={running:true,endsAt:Date.now()+left,left:left};gongKey="";fightSfxShort();break;}
    case "tpause":S.timer={running:false,endsAt:0,left:Math.max(0,S.timer.endsAt-Date.now())};break;
    case "treset":resetTimer();break;
    case "sinc":{const v=(S.scores[S.cur+"_"+d.c]||[null,null])[+d.s];setScore(+d.c,+d.s,(v==null?(S.scoring.mode==="points"?Math.floor(S.scoring.points/2):0):v)+(+d.d));render();return;}
    case "next":{if(!roundDone(S.cur)){ask(t("missing"),goNext);return;}goNext();return;}
    case "reg":{if(RO)return;const p=P(d.id);regFor=d.id;regDraft={name:p.name||"",nick:p.nick||"",g:p.g||"m",agree:!!(REG[d.id]&&REG[d.id].agree)};renderLayer();return;}
    case "paid":{const v=!PAID[d.id];if(v)PAID[d.id]=true;else delete PAID[d.id];dbWrite("paid",d.id,v?{v:true,by:UID||null,at:Date.now()}:null);render();return;}
    case "edit":S.phase="setup";step=0;ls.set("pfn_step","0");break;
    case "ask":{if(d.what==="resetres")ask(t("sure"),()=>{clearScores();S.cur=0;S.finished=false;resetTimer();if(S.format==="mexicano"||S.format==="king")S.rounds=S.rounds.slice(0,1);save();render();});
      else ask(t("sure"),()=>{const keep={lang:S.lang,theme:S.theme};S=Object.assign(defaults(),keep);normalize();step=0;ls.set("pfn_step","0");save();clearScores();Object.keys(PH).forEach(id=>savePhoto(id,null));Object.keys(REG).forEach(id=>dbWrite("reg",id,null));Object.keys(PAID).forEach(id=>dbWrite("paid",id,null));REG={};PAID={};render();});return;}
    default:return;
  }
  save();render();
}
function fightSfxShort(){if(!S.sound)return;const a=ac();if(!a)return;const t0=a.currentTime;const o=a.createOscillator(),v=a.createGain();o.type="square";o.frequency.setValueAtTime(880,t0);v.gain.setValueAtTime(.12,t0);v.gain.exponentialRampToValueAtTime(.001,t0+.25);o.connect(v);v.connect(a.destination);o.start(t0);o.stop(t0+.3);}

document.addEventListener("click",e=>{if(Date.now()<blockUntil){e.preventDefault();return;}let el=e.target.closest("[data-act],[data-stop]");if(el&&el.dataset.stop&&!e.target.closest("[data-act]"))return;el=e.target.closest("[data-act]");if(!el||el.disabled)return;ac();act(el.dataset.act,el.dataset,el);});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("span[data-act]")){e.preventDefault();e.target.click();}});
let inT=null;
document.addEventListener("input",e=>{const el=e.target,k=el.dataset&&el.dataset.in;if(!k){if(el.id==="paste")pasteText=el.value;return;}if(RO)return;
  if(k==="rname"&&regDraft){regDraft.name=el.value;return;}
  if(k==="rnick"&&regDraft){regDraft.nick=el.value;return;}
  if(k==="name"||k==="nick"){Pb(el.dataset.id)[k]=el.value;save();return;}
  if(k==="court"){S.courts[+el.dataset.i].name=el.value;save();return;}
  if(k==="mtotal"){S.money.total=parseFloat(String(el.value).replace(",","."))||0;save();clearTimeout(inT);inT=setTimeout(()=>{if(document.activeElement!==el)render();},600);return;}
});
document.addEventListener("change",e=>{const el=e.target,k=el.dataset&&el.dataset.in;if(!k||RO)return;
  if(k==="score"){const v=el.value===""?null:+el.value;setScore(+el.dataset.c,+el.dataset.s,v);softRender();return;}
  if(k==="mpayer"){S.money.payer=el.value;save();render();return;}
  if(k==="mtotal"){render();return;}
});
document.addEventListener("focusout",()=>{setTimeout(()=>{if(pendingRender&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))render();},50);});
$("#file").addEventListener("change",async e=>{const f=e.target.files&&e.target.files[0];if(!f||!photoFor)return;const p=P(photoFor);
  try{const src=await processPhoto(f,COLORS[(p.c||0)%COLORS.length],S.stylize);await savePhoto(photoFor,src);render();}catch(err){toast(t("photo_err"));}photoFor=null;});

document.documentElement.style.setProperty("--gri",`url("${IMG_GRI}")`);
function fitFrame(){const d=document.getElementById("dev");if(!d)return;if(innerWidth>=760&&innerHeight>=700){const f=Math.min(1,(innerHeight-24)/896,(innerWidth-24)/424);d.style.setProperty("--fs",f.toFixed(3));}else d.style.removeProperty("--fs");}
addEventListener("resize",fitFrame);fitFrame();
render();boot();
})();
</script>
